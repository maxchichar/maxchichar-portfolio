name: Cloudflare compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:edge
      - run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_SITE_URL: https://chibuezemaxwell.com
          STORAGE_PUBLIC_URL: https://pub-be5b26d4fdc14d42a7bfa1843c84c207.r2.dev
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFUGnPMVpoAs1uxW
      - run: npm run check:cloudflare
      # Intentionally no deployment: DNS, secrets and production cutover need approval.
